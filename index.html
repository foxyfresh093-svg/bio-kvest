<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Междисциплинарный квест: Химия + Биология</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #e8f4f8;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            max-width: 600px;
            width: 100%;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            font-size: 24px;
        }
        .step {
            display: none;
        }
        .step.active {
            display: block;
        }
        .question {
            font-size: 18px;
            margin-bottom: 15px;
            font-weight: bold;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #3498db;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .btn-answer {
            background-color: #ecf0f1;
            color: #333;
            text-align: left;
            border: 2px solid #bdc3c7;
        }
        .btn-answer:hover {
            background-color: #d5dbdb;
            border-color: #3498db;
        }
        .btn-answer.correct {
            background-color: #2ecc71;
            color: white;
            border-color: #27ae60;
        }
        .btn-answer.wrong {
            background-color: #e74c3c;
            color: white;
            border-color: #c0392b;
        }
        .result {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            color: #2c3e50;
        }
        .explanation {
            font-size: 14px;
            color: #555;
            margin-top: 10px;
            font-style: italic;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>🧪 Квест: Тайны жизни 🧬</h1>
    <p style="text-align: center;">Проверь свои знания на стыке химии и биологии!</p>

    <!-- ЭТАП 1: Неорганическая химия -->
    <div class="step active" id="step1">
        <div class="question">1. Неорганическая химия. Какое вещество является основой жизни на Земле и входит в состав всех клеток?</div>
        <div class="options" id="options1">
            <button class="btn-answer" onclick="checkAnswer(1, this, true)">Вода (H₂O)</button>
            <button class="btn-answer" onclick="checkAnswer(1, this, false)">Углекислый газ (CO₂)</button>
            <button class="btn-answer" onclick="checkAnswer(1, this, false)">Кислород (O₂)</button>
        </div>
        <div class="explanation" id="exp1"></div>
    </div>

    <!-- ЭТАП 2: Органическая химия -->
    <div class="step" id="step2">
        <div class="question">2. Органическая химия. Какой химический элемент является основой всех органических соединений (белков, жиров, углеводов)?</div>
        <div class="options" id="options2">
            <button class="btn-answer" onclick="checkAnswer(2, this, false)">Кислород</button>
            <button class="btn-answer" onclick="checkAnswer(2, this, true)">Углерод</button>
            <button class="btn-answer" onclick="checkAnswer(2, this, false)">Водород</button>
        </div>
        <div class="explanation" id="exp2"></div>
    </div>

    <!-- ФИНАЛ -->
    <div class="step" id="step3">
        <div class="result" id="final-result"></div>
        <button onclick="location.reload()" style="width: 100%; margin-top: 20px; background-color: #2c3e50;">Пройти заново</button>
    </div>

</div>

<script>
    let score = 0;

    function checkAnswer(step, button, isCorrect) {
        // Блокируем все кнопки в текущем шаге
        const buttons = document.getElementById('options' + step).getElementsByTagName('button');
        for (let btn of buttons) {
            btn.disabled = true;
        }

        // Подсвечиваем правильный/неправильный ответ
        if (isCorrect) {
            button.classList.add('correct');
            score++;
            document.getElementById('exp' + step).innerText = "Верно! Отличная работа.";
        } else {
            button.classList.add('wrong');
            document.getElementById('exp' + step).innerText = "Неверно. Запомни правильный ответ!";
            // Подсвечиваем правильный вариант зеленым для обучения
            for (let btn of buttons) {
                if (btn.getAttribute('onclick').includes('true')) {
                    btn.classList.add('correct');
                }
            }
        }

        // Переход к следующему шагу через 2 секунды
        setTimeout(() => {
            document.getElementById('step' + step).classList.remove('active');
            if (step < 2) {
                document.getElementById('step' + (step + 1)).classList.add('active');
            } else {
                showFinal();
            }
        }, 2000);
    }

    function showFinal() {
        const finalStep = document.getElementById('step3');
        const resultText = document.getElementById('final-result');
        
        finalStep.classList.add('active');
        
        if (score === 2) {
            resultText.innerHTML = "🏆 Победа! Ты отлично разбираешься в химии и биологии!<br>Твой результат: 2 из 2.";
            resultText.style.color = "#2ecc71";
        } else if (score === 1) {
            resultText.innerHTML = "👍 Неплохо! Ты на верном пути.<br>Твой результат: 1 из 2.";
            resultText.style.color = "#f39c12";
        } else {
            resultText.innerHTML = "📚 Нужно повторить материал. Попробуй еще раз!<br>Твой результат: 0 из 2.";
            resultText.style.color = "#e74c3c";
        }
    }
</script>

</body>
</html>
